<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebD Cloud - Download</title>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{padding:24px;background:#f5f5f5;max-width:800px;margin:0 auto}
h1{font-size:22px;margin-bottom:20px;color:#333}
#info{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px;margin-bottom:16px}
#info .row{display:flex;padding:6px 0;font-size:14px}
#info .label{color:#888;width:100px;flex-shrink:0}
#info .value{color:#333;word-break:break-all}
#info .value .sha{font-family:monospace;font-size:12px;color:#666}
#proxyZone{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#proxyZone select{padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;min-width:200px}
#proxyZone button{padding:6px 16px;border:1px solid #1976d2;background:#1976d2;color:#fff;border-radius:4px;cursor:pointer;font-size:13px}
#proxyZone button:hover{background:#1565c0}
#proxyStatus{font-size:12px;color:#666}
#actions{margin-bottom:16px}
#actions button{padding:12px 36px;background:#4caf50;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
#actions button:hover{background:#388e3c}
#actions button:disabled{opacity:.5;cursor:not-allowed}
#progress{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px;margin-bottom:16px;display:none}
#progress .row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#progress .row .lbl{font-size:13px;color:#555;min-width:80px}
#progress .bar-wrap{flex:1;height:8px;background:#eee;border-radius:4px;overflow:hidden}
#progress .bar-fill{height:100%;background:#4caf50;border-radius:4px;width:0%;transition:width .3s}
#progress .pct{font-size:13px;color:#666;min-width:40px;text-align:right}
#progress .detail{font-size:12px;color:#888;margin-top:4px}
#status{margin-bottom:16px;padding:12px 16px;border-radius:6px;font-size:14px;display:none}
#status.ok{display:block;background:#e8f5e9;color:#2e7d32}
#status.err{display:block;background:#ffebee;color:#c62828}
#status.wait{display:block;background:#fff8e1;color:#f57f17}
</style>
</head>
<body>

<h1>WebD Cloud - 下载文件</h1>

<div id="info">加载中...</div>

<div id="proxyZone">
    <select id="proxySelect"></select>
    <button id="speedTestBtn">测速</button>
    <span id="proxyStatus"></span>
</div>

<div id="actions">
    <button id="downloadBtn">下载</button>
</div>

<div id="progress">
    <div class="row">
        <span class="lbl">总进度</span>
        <div class="bar-wrap"><div class="bar-fill" id="totalBar"></div></div>
        <span class="pct" id="totalPct">0%</span>
    </div>
    <div class="detail" id="progressDetail"></div>
</div>

<div id="status"></div>

<script>
let entry = null;
let selectedProxy = '';

function $(id) { return document.getElementById(id); }

function params() {
    const p = new URLSearchParams(location.search);
    return p;
}

function formatSize(bytes) {
    if (!bytes) return '-';
    const units = ['B','KB','MB','GB','TB'];
    let i = 0;
    let size = bytes;
    while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
    return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function formatTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function setStatus(msg, type) {
    const el = $('status');
    el.textContent = msg;
    el.className = type || 'wait';
}

async function loadEntry() {
    const path = params().get('path');
    if (!path) { $('info').innerHTML = '<div style="color:red">缺少 path 参数</div>'; return; }
    try {
        const resp = await fetch('index.json?_t=' + Date.now());
        const data = await resp.json();
        entry = data.find(e => e.path === path);
        if (!entry) { $('info').innerHTML = '<div style="color:red">文件记录不存在</div>'; return; }
        renderInfo();
    } catch (e) {
        $('info').innerHTML = '<div style="color:red">加载索引失败: ' + e.message + '</div>';
    }
}

function renderInfo() {
    const isMerged = entry.type === 'merged';
    const typeLabel = isMerged ? '分块文件 (' + entry.chunks.length + ' 块)' : '普通文件';
    const name = entry.path.split('/').pop();
    $('info').innerHTML =
        '<div class="row"><span class="label">文件名</span><span class="value">' + name + '</span></div>' +
        '<div class="row"><span class="label">路径</span><span class="value">' + entry.path + '</span></div>' +
        '<div class="row"><span class="label">大小</span><span class="value">' + formatSize(entry.size) + '</span></div>' +
        '<div class="row"><span class="label">类型</span><span class="value">' + typeLabel + '</span></div>' +
        '<div class="row"><span class="label">修改时间</span><span class="value">' + formatTime(entry.mtime) + '</span></div>' +
        '<div class="row"><span class="label">MIME</span><span class="value">' + (entry.mime || '-') + '</span></div>' +
        (entry.sha256 ? '<div class="row"><span class="label">SHA256</span><span class="value"><span class="sha">' + entry.sha256 + '</span></span></div>' : '');
}

function initProxyZone() {
    const sel = $('proxySelect');
    const cached = (function() {
        try { const d = JSON.parse(localStorage.getItem('proxySpeedTest')); if (d && Date.now() - d.timestamp < 86400000) return d; } catch {}
        return null;
    })();
    if (cached) {
        const success = cached.results.filter(r => r.success).sort((a, b) => b.speed - a.speed);
        sel.innerHTML = '<option value="">直连</option>';
        for (const r of success) {
            const opt = document.createElement('option');
            opt.value = r.node;
            opt.textContent = r.node + ' (' + r.speed.toFixed(2) + ' KB/s)';
            sel.appendChild(opt);
        }
        if (success.length > 0) { sel.value = success[0].node; selectedProxy = success[0].node; }
        $('proxyStatus').textContent = '已缓存 ' + new Date(cached.timestamp).getHours() + ':' + String(new Date(cached.timestamp).getMinutes()).padStart(2,'0');
    } else {
        sel.innerHTML = '<option value="">直连</option>';
        for (const n of CONFIG.nodes) {
            const opt = document.createElement('option');
            opt.value = n.name;
            opt.textContent = '[' + n.type + '] ' + n.name;
            sel.appendChild(opt);
        }
    }
    sel.addEventListener('change', function() { selectedProxy = this.value; });
    $('speedTestBtn').addEventListener('click', startSpeedTest);
}

async function startSpeedTest() {
    const btn = $('speedTestBtn');
    const status = $('proxyStatus');
    btn.disabled = true;
    status.textContent = '测速中...';

    const testUrl = CONFIG.rawBase + 'test_file.dat?t=' + Date.now();
    const concurrency = 20;
    const timeout = 15000;

    const testOne = (node) => new Promise(resolve => {
        const proxyUrl = 'https://' + node.name + '/' + testUrl;
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), timeout);
        const start = performance.now();
        fetch(proxyUrl, { signal: controller.signal })
            .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
            .then(buf => { clearTimeout(tid); const dur = performance.now() - start; resolve({ node: node.name, success: true, duration: dur, speed: (buf.byteLength / 1024) / (dur / 1000) }); })
            .catch(err => { clearTimeout(tid); resolve({ node: node.name, success: false, error: err.name === 'AbortError' ? '超时' : err.message }); });
    });

    const tasks = CONFIG.nodes.map(n => () => testOne(n));
    async function runBatch(tasks, limit) { const results = []; const exec = []; for (const t of tasks) { const p = t().then(r => { exec.splice(exec.indexOf(p), 1); return r; }); results.push(p); exec.push(p); if (exec.length >= limit) await Promise.race(exec); } return Promise.all(results); }

    const res = await runBatch(tasks, concurrency);
    const success = res.filter(r => r.success).sort((a, b) => b.speed - a.speed);
    try { localStorage.setItem('proxySpeedTest', JSON.stringify({ timestamp: Date.now(), results: res })); } catch {}

    const sel = $('proxySelect');
    sel.innerHTML = '<option value="">直连</option>';
    for (const r of success) {
        const opt = document.createElement('option');
        opt.value = r.node;
        opt.textContent = r.node + ' (' + r.speed.toFixed(2) + ' KB/s)';
        sel.appendChild(opt);
    }
    if (success.length > 0) { sel.value = success[0].node; selectedProxy = success[0].node; }
    status.textContent = success.length > 0 ? '最快: ' + success[0].node : '全部不可用';
    btn.disabled = false;
}

function buildFileUrl(filePath) {
    return selectedProxy ? CONFIG.buildProxyUrl(selectedProxy, filePath) : CONFIG.buildRawUrl(filePath);
}

async function sha256Blob(blob) {
    const buf = await blob.arrayBuffer();
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function saveBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function showProgress(pct, detail) {
    $('progress').style.display = '';
    $('totalBar').style.width = pct + '%';
    $('totalPct').textContent = Math.round(pct) + '%';
    if (detail !== undefined) $('progressDetail').textContent = detail;
}

async function doDownload() {
    if (!entry) { setStatus('文件记录不存在', 'err'); return; }
    const btn = $('downloadBtn');
    btn.disabled = true;
    setStatus('', '');
    showProgress(0, '准备中...');

    const fileName = entry.path.split('/').pop();

    try {
        if (entry.type === 'merged') {
            const chunks = entry.chunks;
            const total = chunks.length;
            const blobs = [];
            let completed = 0;

            const tasks = chunks.map((chunkPath, i) => async () => {
                const url = buildFileUrl(chunkPath);
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('分块 ' + chunkPath + ' 失败: HTTP ' + resp.status);
                const blob = await resp.blob();
                blobs[i] = blob;
                completed++;
                const pct = Math.round((completed / total) * 100);
                showProgress(pct, '已下载 ' + completed + '/' + total + ' 块');
            });

            const concurrency = 5;
            const exec = [];
            for (const t of tasks) {
                const p = t().then(r => { exec.splice(exec.indexOf(p), 1); return r; });
                exec.push(p);
                if (exec.length >= concurrency) await Promise.race(exec);
            }
            await Promise.all(exec);

            showProgress(95, '正在拼接...');
            const merged = new Blob(blobs);

            if (entry.sha256) {
                showProgress(97, '校验 SHA256...');
                const hash = await sha256Blob(merged);
                if (hash !== entry.sha256) { setStatus('SHA256 校验失败: 期望 ' + entry.sha256 + '，实际 ' + hash, 'err'); btn.disabled = false; return; }
            }

            showProgress(100, '保存中...');
            saveBlob(merged, fileName);
            setStatus('下载完成，SHA256 校验通过', 'ok');
        } else {
            const url = buildFileUrl(entry.path);
            showProgress(10, '下载中...');
            const resp = await fetch(url);
            if (!resp.ok) { setStatus('下载失败: HTTP ' + resp.status, 'err'); btn.disabled = false; return; }
            const reader = resp.body.getReader();
            const contentLength = parseInt(resp.headers.get('content-length') || entry.size, 10);
            const chunks = [];
            let received = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                showProgress(Math.round((received / contentLength) * 90), formatSize(received) + ' / ' + formatSize(contentLength));
            }
            const blob = new Blob(chunks);

            if (entry.sha256) {
                showProgress(95, '校验 SHA256...');
                const hash = await sha256Blob(blob);
                if (hash !== entry.sha256) { setStatus('SHA256 校验失败: 期望 ' + entry.sha256 + '，实际 ' + hash, 'err'); btn.disabled = false; return; }
            }

            showProgress(100, '保存中...');
            saveBlob(blob, fileName);
            setStatus('下载完成，SHA256 校验通过', 'ok');
        }
    } catch (e) {
        setStatus('下载失败: ' + e.message, 'err');
    }
    btn.disabled = false;
}

$('downloadBtn').addEventListener('click', doDownload);

window.addEventListener('DOMContentLoaded', function() {
    initProxyZone();
    loadEntry();
});
</script>
</body>
</html>

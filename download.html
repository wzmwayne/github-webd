<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebD Cloud - Download</title>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{padding:24px;background:#f5f5f5;max-width:800px;margin:0 auto}
h1{font-size:22px;margin-bottom:20px;color:#333}
#info{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px;margin-bottom:16px}
#info .row{display:flex;padding:6px 0;font-size:14px}
#info .label{color:#888;width:100px;flex-shrink:0}
#info .value{color:#333;word-break:break-all}
#info .value .sha{font-family:monospace;font-size:12px;color:#666}
#proxyZone{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#proxyZone select{padding:6px 10px;border:1px solid #ccc;border-radius:4px;font-size:13px;min-width:200px}
#proxyZone button{padding:6px 16px;border:1px solid #1976d2;background:#1976d2;color:#fff;border-radius:4px;cursor:pointer;font-size:13px}
#proxyZone button:hover{background:#1565c0}
#proxyStatus{font-size:12px;color:#666}
#threadZone{display:flex;align-items:center;gap:6px}
#threadZone label{font-size:13px;color:#666}
#threadZone input{width:60px;padding:6px;border:1px solid #ccc;border-radius:4px;font-size:13px}
#speedTestBox{display:none;background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin-bottom:16px}
#speedTestBox .row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#speedTestBox .row .lbl{font-size:13px;color:#555;min-width:80px}
#speedTestBox .bar-wrap{flex:1;height:8px;background:#eee;border-radius:4px;overflow:hidden}
#speedTestBox .bar-fill{height:100%;background:#1976d2;border-radius:4px;width:0%;transition:width .3s}
#speedTestBox .pct{font-size:13px;color:#666;min-width:40px;text-align:right}
#speedTestBox .detail{font-size:12px;color:#888;margin-top:4px;white-space:pre-line;max-height:240px;overflow:auto}
#actions{margin-bottom:16px}
#actions button{padding:12px 36px;background:#4caf50;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer}
#actions button:hover{background:#388e3c}
#actions button:disabled{opacity:.5;cursor:not-allowed}
#progress{background:#fff;border:1px solid #ddd;border-radius:8px;padding:20px;margin-bottom:16px;display:none}
#progress .row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
#progress .row .lbl{font-size:13px;color:#555;min-width:80px}
#progress .bar-wrap{flex:1;height:8px;background:#eee;border-radius:4px;overflow:hidden}
#progress .bar-fill{height:100%;background:#4caf50;border-radius:4px;width:0%;transition:width .3s}
#progress .pct{font-size:13px;color:#666;min-width:40px;text-align:right}
#progress .detail{font-size:12px;color:#888;margin-top:4px;white-space:pre-line}
#status{margin-bottom:16px;padding:12px 16px;border-radius:6px;font-size:14px;display:none}
#status.ok{display:block;background:#e8f5e9;color:#2e7d32}
#status.err{display:block;background:#ffebee;color:#c62828}
#status.wait{display:block;background:#fff8e1;color:#f57f17}
#debugToggle{margin-bottom:16px;padding:6px 16px;border:1px solid #ccc;background:#fff;color:#666;border-radius:4px;cursor:pointer;font-size:13px}
#debugToggle:hover{background:#f0f0f0}
#debug{display:none;background:#1e1e1e;color:#d4d4d4;font-family:monospace;font-size:12px;padding:12px;border-radius:8px;margin-bottom:16px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-all}
#debug .log-line{margin:0;padding:2px 0;border-bottom:1px solid #2a2a2a}
#debug .log-line .ts{color:#888;margin-right:8px}
#debug .log-line.info{color:#4fc3f7}
#debug .log-line.ok{color:#81c784}
#debug .log-line.warn{color:#ffb74d}
#debug .log-line.err{color:#e57373}
</style>
</head>
<body>

<h1>WebD Cloud - 下载文件</h1>

<div id="info">加载中...</div>

<div id="proxyZone">
    <select id="proxySelect"></select>
    <button id="speedTestBtn">测速</button>
    <span id="proxyStatus"></span>
    <span id="threadZone"><label for="threadInput">线程</label><input type="number" id="threadInput" min="1" max="20" value="5"></span>
</div>

<div id="speedTestBox">
    <div class="row">
        <span class="lbl">测速进度</span>
        <div class="bar-wrap"><div class="bar-fill" id="stBar"></div></div>
        <span class="pct" id="stPct">0%</span>
    </div>
    <div class="detail" id="stDetail"></div>
</div>

<div id="actions">
    <button id="downloadBtn">下载</button>
</div>

<div id="progress">
    <div class="row">
        <span class="lbl">总进度</span>
        <div class="bar-wrap"><div class="bar-fill" id="totalBar"></div></div>
        <span class="pct" id="totalPct">0%</span>
    </div>
    <div class="detail" id="progressDetail"></div>
</div>

<div id="status"></div>

<button id="debugToggle">调试日志</button>
<div id="debug"></div>

<script>
let entry = null;
let selectedProxy = '';
let downloadStartTs = null;

function $(id) { return document.getElementById(id); }

function log(msg, level) {
    const ts = new Date().toTimeString().split(' ')[0];
    const line = ts + ' ' + msg;
    if (window.console && console.log) console.log('%c' + line, 'color:#4fc3f7');
    const el = $('debug');
    if (el) {
        const div = document.createElement('div');
        div.className = 'log-line ' + (level || 'info');
        div.innerHTML = '<span class="ts">' + ts + '</span>' + msg.replace(/</g, '&lt;');
        el.appendChild(div);
        el.scrollTop = el.scrollHeight;
    }
}

function params() {
    const p = new URLSearchParams(location.search);
    return p;
}

function formatSize(bytes) {
    if (!bytes) return '-';
    const units = ['B','KB','MB','GB','TB'];
    let i = 0;
    let size = bytes;
    while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
    return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function formatTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function setStatus(msg, type) {
    const el = $('status');
    el.textContent = msg;
    el.className = type || 'wait';
}

async function loadEntry() {
    const path = params().get('path');
    if (!path) {
        log('缺少 path 参数', 'err');
        $('info').innerHTML = '<div style="color:red">缺少 path 参数</div>';
        return;
    }
    log('请求索引: index.json?_t=' + Date.now(), 'info');
    try {
        const t0 = performance.now();
        const resp = await fetch('index.json?_t=' + Date.now());
        log('索引响应: HTTP ' + resp.status + ' (' + Math.round(performance.now() - t0) + 'ms, ' + (resp.headers.get('content-length') || '?') + 'B)', 'info');
        const data = await resp.json();
        log('索引解析成功: ' + data.length + ' 条记录', 'ok');
        entry = data.find(e => e.path === path);
        if (!entry) {
            log('未找到记录: ' + path, 'err');
            $('info').innerHTML = '<div style="color:red">文件记录不存在</div>';
            return;
        }
        log('匹配记录: type=' + entry.type + ', size=' + formatSize(entry.size) + (entry.chunks ? ', chunks=' + entry.chunks.length : ''), 'ok');
        renderInfo();
    } catch (e) {
        log('加载索引失败: ' + e.message, 'err');
        $('info').innerHTML = '<div style="color:red">加载索引失败: ' + e.message + '</div>';
    }
}

function renderInfo() {
    const isMerged = entry.type === 'merged';
    const typeLabel = isMerged ? '分块文件 (' + entry.chunks.length + ' 块)' : '普通文件';
    const name = entry.path.split('/').pop();
    $('info').innerHTML =
        '<div class="row"><span class="label">文件名</span><span class="value">' + name + '</span></div>' +
        '<div class="row"><span class="label">路径</span><span class="value">' + entry.path + '</span></div>' +
        '<div class="row"><span class="label">大小</span><span class="value">' + formatSize(entry.size) + '</span></div>' +
        '<div class="row"><span class="label">类型</span><span class="value">' + typeLabel + '</span></div>' +
        '<div class="row"><span class="label">修改时间</span><span class="value">' + formatTime(entry.mtime) + '</span></div>' +
        '<div class="row"><span class="label">MIME</span><span class="value">' + (entry.mime || '-') + '</span></div>' +
        (entry.sha256 ? '<div class="row"><span class="label">SHA256</span><span class="value"><span class="sha">' + entry.sha256 + '</span></span></div>' : '');
}

function initProxyZone() {
    const sel = $('proxySelect');
    const cached = (function() {
        try { const d = JSON.parse(localStorage.getItem('proxySpeedTest')); if (d && Date.now() - d.timestamp < 86400000) return d; } catch {}
        return null;
    })();
    if (cached) {
        const success = cached.results.filter(r => r.success).sort((a, b) => b.speed - a.speed);
        sel.innerHTML = '<option value="">直连</option>';
        for (const r of success) {
            const opt = document.createElement('option');
            opt.value = r.node;
            opt.textContent = r.node + ' (' + r.speed.toFixed(2) + ' KB/s)';
            sel.appendChild(opt);
        }
        if (success.length > 0) { sel.value = success[0].node; selectedProxy = success[0].node; }
        const t = new Date(cached.timestamp);
        $('proxyStatus').textContent = '已缓存 ' + t.getHours() + ':' + String(t.getMinutes()).padStart(2,'0');
        log('读取缓存测速结果: ' + cached.results.filter(r => r.success).length + ' 个可用节点（缓存于 ' + t.toLocaleString() + '）', 'info');
        if (selectedProxy) log('自动选择缓存最快节点: ' + selectedProxy, 'ok');
    } else {
        sel.innerHTML = '<option value="">直连</option>';
        for (const n of CONFIG.nodes) {
            const opt = document.createElement('option');
            opt.value = n.name;
            opt.textContent = '[' + n.type + '] ' + n.name;
            sel.appendChild(opt);
        }
        log('无缓存测速结果，加载全部节点: ' + CONFIG.nodes.length + ' 个', 'info');
    }
    sel.addEventListener('change', function() {
        selectedProxy = this.value;
        log('切换代理: ' + (selectedProxy || '直连'), 'warn');
    });
    $('speedTestBtn').addEventListener('click', startSpeedTest);
}

async function startSpeedTest() {
    const btn = $('speedTestBtn');
    const status = $('proxyStatus');
    btn.disabled = true;
    status.textContent = '测速中...';

    const testUrl = CONFIG.rawBase + 'test_file.dat?t=' + Date.now();
    const concurrency = 20;
    const timeout = 15000;
    const nodes = CONFIG.nodes;
    const TEST_SIZE = 2 * 1024 * 1024;
    const nodeRecv = new Array(nodes.length).fill(0);
    const nodeTotal = new Array(nodes.length).fill(0);
    const nodeDone = new Array(nodes.length).fill(false);
    let lastRender = 0;
    const box = $('speedTestBox');
    box.style.display = 'block';

    log('开始测速: ' + nodes.length + ' 节点, 并发 ' + concurrency + ', 超时 ' + timeout + 'ms', 'info');
    log('测速 URL: ' + testUrl, 'info');

    function renderST(force) {
        const now = Date.now();
        if (!force && now - lastRender < 100) return;
        lastRender = now;
        let sum = 0;
        let done = 0;
        let target = 0;
        for (let i = 0; i < nodes.length; i++) {
            sum += nodeRecv[i];
            if (nodeDone[i]) done++;
            target += nodeTotal[i] || TEST_SIZE;
        }
        const pct = target > 0 ? Math.min(100, Math.round((sum / target) * 100)) : 0;
        const bar = $('stBar');
        if (bar) bar.style.width = pct + '%';
        const pl = $('stPct');
        if (pl) pl.textContent = pct + '%';
        const lines = [];
        for (let i = 0; i < nodes.length; i++) {
            const t = nodeTotal[i] || TEST_SIZE;
            const mark = nodeDone[i] ? (nodeRecv[i] >= t ? ' ✓' : ' ✗') : '';
            lines.push(nodes[i].name + ': ' + formatSize(nodeRecv[i]) + ' / ' + formatSize(t) + mark);
        }
        lines.push('已完成 ' + done + '/' + nodes.length + ' 个节点');
        const el = $('stDetail');
        if (el) el.textContent = lines.join('\n');
    }

    const testOne = (node, idx) => new Promise(resolve => {
        const proxyUrl = 'https://' + node.name + '/' + testUrl;
        const controller = new AbortController();
        const tid = setTimeout(() => controller.abort(), timeout);
        const start = performance.now();
        fetch(proxyUrl, { signal: controller.signal })
            .then(r => {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const cl = r.headers.get('content-length');
                if (cl) nodeTotal[idx] = parseInt(cl, 10);
                const reader = r.body.getReader();
                let received = 0;
                const step = () => reader.read().then(({ done, value }) => {
                    if (done) return received;
                    received += value.length;
                    nodeRecv[idx] = received;
                    renderST();
                    return step();
                });
                return step();
            })
            .then(size => {
                clearTimeout(tid);
                const dur = performance.now() - start;
                const speed = (size / 1024) / (dur / 1000);
                nodeDone[idx] = true;
                nodeRecv[idx] = size;
                renderST(true);
                const r = { node: node.name, success: true, duration: dur, speed: speed };
                log('[测速] ' + node.name + ' 成功: ' + speed.toFixed(2) + ' KB/s (' + Math.round(dur) + 'ms)', 'ok');
                resolve(r);
            })
            .catch(err => {
                clearTimeout(tid);
                const errMsg = err.name === 'AbortError' ? '超时' : err.message;
                nodeDone[idx] = true;
                renderST(true);
                const r = { node: node.name, success: false, error: errMsg, duration: performance.now() - start };
                log('[测速] ' + node.name + ' 失败: ' + errMsg + ' (' + Math.round(r.duration) + 'ms)', 'warn');
                resolve(r);
            });
    });

    const tasks = nodes.map((n, idx) => () => testOne(n, idx));
    async function runBatch(tasks, limit) { const results = []; const exec = []; for (const t of tasks) { const p = t().then(r => { exec.splice(exec.indexOf(p), 1); return r; }); results.push(p); exec.push(p); if (exec.length >= limit) await Promise.race(exec); } return Promise.all(results); }

    const t0 = performance.now();
    const res = await runBatch(tasks, concurrency);
    const totalMs = Math.round(performance.now() - t0);
    const success = res.filter(r => r.success).sort((a, b) => b.speed - a.speed);
    const fail = res.filter(r => !r.success);
    log('测速完成: ' + totalMs + 'ms, 成功 ' + success.length + ', 失败 ' + fail.length, success.length ? 'ok' : 'err');
    try { localStorage.setItem('proxySpeedTest', JSON.stringify({ timestamp: Date.now(), results: res })); } catch {}

    const sel = $('proxySelect');
    sel.innerHTML = '<option value="">直连</option>';
    for (const r of success) {
        const opt = document.createElement('option');
        opt.value = r.node;
        opt.textContent = r.node + ' (' + r.speed.toFixed(2) + ' KB/s)';
        sel.appendChild(opt);
    }
    if (success.length > 0) { sel.value = success[0].node; selectedProxy = success[0].node; }
    status.textContent = success.length > 0 ? '最快: ' + success[0].node : '全部不可用';
    if (success.length > 0) log('已自动选择最快节点: ' + selectedProxy, 'ok');
    btn.disabled = false;
}

function buildFileUrl(filePath) {
    return selectedProxy ? CONFIG.buildProxyUrl(selectedProxy, filePath) : CONFIG.buildRawUrl(filePath);
}

async function sha256Blob(blob) {
    const buf = await blob.arrayBuffer();
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function saveBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function showProgress(pct, detail) {
    $('progress').style.display = 'block';
    const bar = $('totalBar');
    if (bar) bar.style.width = pct + '%';
    const label = $('totalPct');
    if (label) label.textContent = Math.round(pct) + '%';
    if (detail !== undefined) {
        const el = $('progressDetail');
        if (el) el.textContent = detail;
    }
}

const speedSamples = [];
function pushSpeedSample(bytes) {
    const now = performance.now();
    speedSamples.push({ t: now, bytes });
    while (speedSamples.length > 2 && speedSamples[0].t < now - 10000) speedSamples.shift();
}
function calcSpeed() {
    const now = performance.now();
    const fresh = speedSamples.filter(s => now - s.t <= 5000);
    if (fresh.length < 2) return 0;
    const first = fresh[0];
    const last = fresh[fresh.length - 1];
    const dt = (last.t - first.t) / 1000;
    if (dt <= 0) return 0;
    return (last.bytes - first.bytes) / dt;
}
function speedText(bytesPerSec) {
    return bytesPerSec > 0 ? formatSize(bytesPerSec) + '/s' : '--';
}
function fmtEta(seconds) {
    if (!isFinite(seconds) || seconds < 0) return '--:--';
    seconds = Math.round(seconds);
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    const pad = n => String(n).padStart(2, '0');
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
}

const THREAD_KEY = 'downloadThreads';
function initThreadZone() {
    const input = $('threadInput');
    const saved = localStorage.getItem(THREAD_KEY);
    if (saved && /^[1-9]\d*$/.test(saved)) input.value = Math.max(1, Math.min(20, parseInt(saved, 10)));
    input.addEventListener('change', function() {
        let v = Math.max(1, Math.min(20, parseInt(this.value, 10) || 5));
        this.value = v;
        try { localStorage.setItem(THREAD_KEY, String(v)); } catch {}
        log('设置并发线程数: ' + v, 'info');
    });
}
function currentThreads() {
    return Math.max(1, Math.min(20, parseInt($('threadInput').value, 10) || 5));
}

async function doDownload() {
    if (!entry) { setStatus('文件记录不存在', 'err'); log('未找到文件记录，无法下载', 'err'); return; }
    const btn = $('downloadBtn');
    btn.disabled = true;
    setStatus('', '');
    showProgress(0, '准备中...');
    downloadStartTs = performance.now();
    speedSamples.length = 0;
    const MAX_RETRY = 3;

    const fileName = entry.path.split('/').pop();
    log('======== 开始下载: ' + fileName + ' ========', 'info');
    log('类型: ' + entry.type + ', 大小: ' + formatSize(entry.size) + ' (' + entry.size + ' 字节)', 'info');
    log('下载源: ' + (selectedProxy ? '代理 ' + selectedProxy : '直连 raw'), 'info');

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function fetchWithRetry(url, retries) {
        let lastErr;
        for (let attempt = 1; attempt <= retries; attempt++) {
            try {
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
                return resp;
            } catch (e) {
                lastErr = e;
                log('请求失败 (第' + attempt + '/' + retries + '次): ' + e.message, 'warn');
                if (attempt < retries) {
                    const wait = attempt * 1500;
                    log('  ' + (wait / 1000).toFixed(1) + 's 后重试: ' + url, 'info');
                    await sleep(wait);
                }
            }
        }
        throw lastErr;
    }

    try {
        if (entry.type === 'merged') {
            const chunks = entry.chunks;
            const total = chunks.length;
            const blobs = new Array(total);
            const recvBytes = new Array(total).fill(0);
            const expBytes = new Array(total).fill(0);
            const chunkSize = entry.chunkSize || Math.ceil(entry.size / total);
            const concurrency = currentThreads();
            let aborted = false;
            let lastRender = 0;

            log('分块文件: 共 ' + total + ' 块, 每块 ' + formatSize(chunkSize), 'info');
            log('并发下载: ' + concurrency + ' 线程, 失败自动重试 ' + MAX_RETRY + ' 次', 'info');

            function renderChunkProgress(force) {
                const now = Date.now();
                if (!force && now - lastRender < 100) return;
                lastRender = now;
                const sum = recvBytes.reduce((s, v) => s + v, 0);
                const speed = calcSpeed();
                const eta = speed > 0 ? (entry.size - sum) / speed : -1;
                const lines = [];
                for (let i = 0; i < total; i++) {
                    const exp = expBytes[i] || chunkSize;
                    const done = blobs[i] ? ' ✓' : '';
                    lines.push('块 ' + (i + 1) + '/' + total + ': ' + formatSize(recvBytes[i]) + ' / ' + formatSize(exp) + done);
                }
                const pct = Math.min(99, Math.round((sum / entry.size) * 100));
                showProgress(pct, '合计: ' + formatSize(sum) + ' / ' + formatSize(entry.size) + ' (' + pct + '%) | 速度: ' + speedText(speed) + ' | 剩余: ' + fmtEta(eta) + '\n' + lines.join('\n'));
                pushSpeedSample(sum);
            }

            async function fetchChunk(chunkPath, i) {
                const url = buildFileUrl(chunkPath);
                for (let attempt = 1; attempt <= MAX_RETRY; attempt++) {
                    if (aborted) throw new Error('已中止');
                    try {
                        log('开始分块 ' + (i + 1) + '/' + total + (attempt > 1 ? ' (第' + attempt + '次)' : '') + ': ' + url, 'info');
                        const t0 = performance.now();
                        const resp = await fetch(url);
                        if (!resp.ok) throw new Error('HTTP ' + resp.status);
                        const cl = resp.headers.get('content-length');
                        const expected = parseInt(cl, 10) || chunkSize;
                        expBytes[i] = expected;
                        let parts = [];
                        let received = 0;
                        if (resp.body && resp.body.getReader) {
                            const reader = resp.body.getReader();
                            while (true) {
                                const { done, value } = await reader.read();
                                if (done) break;
                                parts.push(value);
                                received += value.length;
                                recvBytes[i] = received;
                                renderChunkProgress();
                            }
                        } else {
                            const blob = await resp.blob();
                            received = blob.size;
                            parts = [blob];
                            recvBytes[i] = received;
                        }
                        const blob = new Blob(parts);
                        const dur = Math.round(performance.now() - t0);
                        const speed = blob.size > 0 ? (blob.size / 1024) / (dur / 1000) : 0;
                        blobs[i] = blob;
                        log('分块 ' + (i + 1) + '/' + total + ' 完成: HTTP ' + resp.status + ', ' + formatSize(blob.size) + (cl ? ' (header ' + formatSize(expected) + ')' : '') + ', ' + dur + 'ms, ' + speed.toFixed(1) + ' KB/s', 'ok');
                        renderChunkProgress(true);
                        return;
                    } catch (e) {
                        recvBytes[i] = 0;
                        renderChunkProgress(true);
                        log('分块 ' + (i + 1) + '/' + total + ' 第' + attempt + '/' + MAX_RETRY + '次失败: ' + e.message, 'warn');
                        if (attempt < MAX_RETRY) {
                            const wait = attempt * 1500;
                            log('  ' + (wait / 1000).toFixed(1) + 's 后重试分块 ' + (i + 1), 'info');
                            await sleep(wait);
                        } else {
                            throw new Error('分块 ' + chunkPath + ' 重试' + MAX_RETRY + '次仍失败: ' + e.message);
                        }
                    }
                }
            }

            let nextIdx = 0;
            async function worker() {
                while (!aborted && nextIdx < total) {
                    const i = nextIdx++;
                    try {
                        await fetchChunk(chunks[i], i);
                    } catch (e) {
                        aborted = true;
                        throw e;
                    }
                }
            }

            const workers = Array.from({ length: Math.min(concurrency, total) }, function() { return worker(); });
            await Promise.all(workers);

            const totalBlobSize = blobs.reduce(function(s, b) { return s + (b ? b.size : 0); }, 0);
            log('全部分块下载完成: 合计 ' + formatSize(totalBlobSize), 'ok');
            if (totalBlobSize !== entry.size) log('警告: 分块合计大小 ' + totalBlobSize + ' ≠ 索引大小 ' + entry.size, 'warn');

            showProgress(95, '正在拼接...');
            const merged = new Blob(blobs);
            log('拼接完成: ' + formatSize(merged.size), 'ok');

            if (entry.sha256) {
                showProgress(97, '校验 SHA256...');
                log('SHA256 校验中... 期望: ' + entry.sha256, 'info');
                const t1 = performance.now();
                const hash = await sha256Blob(merged);
                const ok = hash === entry.sha256;
                log('SHA256 计算完成 (' + Math.round(performance.now() - t1) + 'ms): ' + hash, ok ? 'ok' : 'err');
                if (!ok) {
                    setStatus('SHA256 校验失败: 期望 ' + entry.sha256 + '，实际 ' + hash, 'err');
                    log('SHA256 校验失败: 期望 ' + entry.sha256 + '，实际 ' + hash, 'err');
                    btn.disabled = false;
                    return;
                }
            } else {
                log('索引无 SHA256 记录，跳过校验', 'warn');
            }

            showProgress(100, '保存中...');
            saveBlob(merged, fileName);
            setStatus('下载完成，SHA256 校验通过', 'ok');
            log('保存触发完成, 总耗时 ' + Math.round((performance.now() - downloadStartTs) / 1000) + 's', 'ok');
        } else {
            const url = buildFileUrl(entry.path);
            showProgress(5, '下载中 (第1次尝试)...');
            log('普通文件下载: ' + url, 'info');
            const t0 = performance.now();
            const resp = await fetchWithRetry(url, MAX_RETRY);
            if (!resp.ok) {
                setStatus('下载失败: HTTP ' + resp.status, 'err');
                log('HTTP 错误: ' + resp.status + ' ' + resp.statusText, 'err');
                btn.disabled = false;
                return;
            }
            const ct = resp.headers.get('content-type');
            const cl = resp.headers.get('content-length');
            log('响应: HTTP ' + resp.status + ', Content-Type: ' + (ct || '未知') + ', Content-Length: ' + (cl || '未知'), 'info');
            const reader = resp.body.getReader();
            const contentLength = parseInt(cl || entry.size, 10);
            const chunks = [];
            let received = 0;
            let lastPct = 0;
            let lastTick = 0;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                chunks.push(value);
                received += value.length;
                const pct = Math.round((received / contentLength) * 90);
                pushSpeedSample(received);
                const nowMs = performance.now();
                if (pct !== lastPct || nowMs - lastTick > 300) {
                    lastTick = nowMs;
                    lastPct = pct;
                    const speed = calcSpeed();
                    const eta = speed > 0 ? (contentLength - received) / speed : -1;
                    showProgress(pct, '已下载 ' + formatSize(received) + ' / ' + formatSize(contentLength) + ' | 速度: ' + speedText(speed) + ' | 剩余: ' + fmtEta(eta));
                }
            }
            const dur = Math.round(performance.now() - t0);
            const speed = received > 0 ? (received / 1024) / (dur / 1000) : 0;
            log('流式读取完成: ' + formatSize(received) + ', ' + dur + 'ms, ' + speed.toFixed(1) + ' KB/s', 'ok');
            if (received !== entry.size) log('警告: 实际大小 ' + received + ' ≠ 索引大小 ' + entry.size, 'warn');
            const blob = new Blob(chunks);

            if (entry.sha256) {
                showProgress(95, '校验 SHA256...');
                log('SHA256 校验中... 期望: ' + entry.sha256, 'info');
                const t1 = performance.now();
                const hash = await sha256Blob(blob);
                const ok = hash === entry.sha256;
                log('SHA256 计算完成 (' + Math.round(performance.now() - t1) + 'ms): ' + hash, ok ? 'ok' : 'err');
                if (!ok) {
                    setStatus('SHA256 校验失败: 期望 ' + entry.sha256 + '，实际 ' + hash, 'err');
                    log('SHA256 校验失败: 期望 ' + entry.sha256 + '，实际 ' + hash, 'err');
                    btn.disabled = false;
                    return;
                }
            } else {
                log('索引无 SHA256 记录，跳过校验', 'warn');
            }

            showProgress(100, '保存中...');
            saveBlob(blob, fileName);
            setStatus('下载完成，SHA256 校验通过', 'ok');
            log('保存触发完成, 总耗时 ' + Math.round((performance.now() - downloadStartTs) / 1000) + 's', 'ok');
        }
    } catch (e) {
        setStatus('下载失败: ' + e.message, 'err');
        log('下载异常: ' + e.message, 'err');
        if (e.stack) log('堆栈: ' + e.stack.split('\n').slice(0, 3).join(' | '), 'err');
    }
    btn.disabled = false;
}

$('downloadBtn').addEventListener('click', doDownload);

window.addEventListener('DOMContentLoaded', function() {
    initProxyZone();
    initThreadZone();
    loadEntry();
    $('debugToggle').addEventListener('click', function() {
        const d = $('debug');
        const show = d.style.display === 'none' || d.style.display === '';
        d.style.display = show ? 'block' : 'none';
        this.textContent = show ? '隐藏日志' : '调试日志';
    });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebD Cloud - Upload</title>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{padding:20px;background:#f5f5f5;min-height:100vh}
h1{font-size:22px;margin-bottom:16px;color:#333}
#authBox{background:#fff;border:1px solid #ddd;border-radius:8px;padding:24px;margin-bottom:20px;max-width:480px}
#authBox label{display:block;font-size:14px;margin-bottom:6px;color:#555}
#authBox input[type=password]{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:4px;font-size:14px;margin-bottom:12px}
#authBox .hint{font-size:12px;color:#888;margin-bottom:12px}
#authBox button{padding:10px 24px;background:#1976d2;color:#fff;border:none;border-radius:4px;font-size:14px;cursor:pointer}
#authBox button:hover{background:#1565c0}
#authBox .status{font-size:13px;margin-top:8px;color:#4caf50}
#dropZone{background:#fff;border:2px dashed #ccc;border-radius:8px;padding:40px;text-align:center;margin-bottom:20px;cursor:pointer;transition:all .2s}
#dropZone.dragover{border-color:#1976d2;background:#e3f2fd}
#dropZone .icon{font-size:48px;color:#999}
#dropZone .text{font-size:16px;color:#666;margin-top:8px}
#dropZone .subtext{font-size:13px;color:#999;margin-top:4px}
#dropZone input[type=file]{display:none}
#queue{margin-bottom:20px}
.file-item{background:#fff;border:1px solid #ddd;border-radius:6px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.file-item .info{flex:1;min-width:0}
.file-item .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .meta{font-size:12px;color:#888;margin-top:2px}
.file-item .progress{width:120px;height:6px;background:#eee;border-radius:3px;overflow:hidden}
.file-item .progress-bar{height:100%;background:#4caf50;border-radius:3px;width:0%;transition:width .3s}
.file-item .pct{font-size:12px;color:#666;min-width:36px;text-align:right}
.file-item .status{font-size:12px;min-width:80px;text-align:right}
.status-ok{color:#4caf50}
.status-err{color:#f44336}
.status-wait{color:#999}
.status-active{color:#1976d2}
#actions{margin-top:16px}
#actions button{padding:10px 28px;background:#4caf50;color:#fff;border:none;border-radius:4px;font-size:14px;cursor:pointer;margin-right:8px}
#actions button:hover{background:#388e3c}
#actions button:disabled{opacity:.5;cursor:not-allowed}
#actions .info{font-size:13px;color:#666;display:inline-block;margin-left:12px}
</style>
</head>
<body>

<h1>&#x1F4C1; WebD Cloud - &#x4E0A\u4F20\u6587\u4EF6</h1>

<div id="authBox">
    <label>GitHub Personal Access Token</label>
    <input type="password" id="patInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <div class="hint">需要 repo 权限。Token 仅存于内存，刷新页面后需重新输入。</div>
    <button id="authBtn">&#x1F510; 验证</button>
    <div id="authStatus" class="status"></div>
</div>

<div id="dropZone">
    <div class="icon">&#x1F4C2;</div>
    <div class="text">拖拽文件到此处，或点击选择文件</div>
    <div class="subtext">支持单个文件，超过 90MB 自动分块上传</div>
    <input type="file" id="fileInput" multiple>
</div>

<div id="queue"></div>

<div id="actions">
    <button id="uploadBtn" disabled>&#x1F680; 开始上传</button>
    <span class="info" id="actionInfo"></span>
</div>

<script>
let pat = '';
let authenticated = false;
let files = [];

const apiBase = 'https://api.github.com';
const owner = CONFIG.owner;
const repo = CONFIG.repo;
const branch = CONFIG.branch;
const webdPrefix = CONFIG.webdPrefix;
const chunkThreshold = CONFIG.chunkThreshold;

function $(id) { return document.getElementById(id); }

function toast(msg, color) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 24px;border-radius:6px;font-size:14px;z-index:9999;max-width:80vw';
    el.textContent = msg;
    if (color) el.style.background = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

function formatSize(bytes) {
    const units = ['B','KB','MB','GB','TB'];
    let i = 0;
    let size = bytes;
    while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
    return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

async function api(url, method, body) {
    const headers = { 'Authorization': 'Bearer ' + pat, 'Accept': 'application/vnd.github+json' };
    if (body) { headers['Content-Type'] = 'application/json'; }
    const resp = await fetch(apiBase + url, { method: method || 'GET', headers, body: body ? JSON.stringify(body) : undefined });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.message || ('HTTP ' + resp.status));
    return data;
}

// Auth
$('authBtn').addEventListener('click', async function() {
    pat = $('patInput').value.trim();
    if (!pat) { toast('请输入 PAT'); return; }
    try {
        const user = await api('/user');
        $('authStatus').textContent = '\u2705 \u9A8C\u8BC1\u6210\u529F - ' + (user.login || '');
        authenticated = true;
        $('patInput').disabled = true;
        this.disabled = true;
        $('uploadBtn').disabled = files.length === 0;
        toast('验证通过');
    } catch (e) {
        $('authStatus').textContent = '\u274C ' + e.message;
        $('authStatus').style.color = '#f44336';
        toast('验证失败: ' + e.message, '#f44336');
    }
});

// Drop zone
const dropZone = $('dropZone');
const fileInput = $('fileInput');

dropZone.addEventListener('click', function() { fileInput.click(); });

dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    this.classList.add('dragover');
});
dropZone.addEventListener('dragleave', function() {
    this.classList.remove('dragover');
});
dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
        addFiles(e.dataTransfer.files);
    }
});

fileInput.addEventListener('change', function() {
    if (this.files.length > 0) {
        addFiles(this.files);
        this.value = '';
    }
});

function addFiles(fileList) {
    for (const f of fileList) {
        const existing = files.findIndex(x => x.name === f.name && x.size === f.size);
        if (existing >= 0) files.splice(existing, 1);
        files.push({
            file: f,
            name: f.name,
            size: f.size,
            chunks: [],
            status: 'wait',
            progress: 0,
            error: ''
        });
    }
    renderQueue();
    if (authenticated) $('uploadBtn').disabled = false;
}

function renderQueue() {
    const container = $('queue');
    if (files.length === 0) { container.innerHTML = '<div style="color:#999;padding:12px;text-align:center;font-size:14px;">尚未添加文件</div>'; return; }
    container.innerHTML = '';
    for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const div = document.createElement('div');
        div.className = 'file-item';
        div.id = 'file-' + i;

        const chunkInfo = f.file && f.file.size >= chunkThreshold ? ('\u5206\u4E3A ' + Math.ceil(f.file.size / chunkThreshold) + ' \u5757') : '\u5355\u6587\u4EF6';
        const statusMap = {
            'wait': '<span class="status-wait">等待上传</span>',
            'uploading': '<span class="status-active">上传中...</span>',
            'done': '<span class="status-ok">\u2705 完成</span>',
            'error': '<span class="status-err">\u274C ' + f.error + '</span>'
        };

        div.innerHTML = '<div class="info"><div class="name">' + f.name + '</div><div class="meta">' + formatSize(f.size) + ' \xB7 ' + chunkInfo + '</div></div><div class="progress"><div class="progress-bar" style="width:' + f.progress + '%"></div></div><div class="pct">' + Math.round(f.progress) + '%</div><div class="status">' + (statusMap[f.status] || '') + '</div>';
        container.appendChild(div);
    }
}

function updateFileProgress(index, pct, status, error) {
    if (index < 0 || index >= files.length) return;
    if (pct !== undefined) files[index].progress = pct;
    if (status) {
        files[index].status = status;
        if (status === 'error') files[index].error = error || '';
    }
    const item = document.getElementById('file-' + index);
    if (!item) return;
    const bar = item.querySelector('.progress-bar');
    const pctEl = item.querySelector('.pct');
    const statusEl = item.querySelector('.status');
    if (bar) bar.style.width = files[index].progress + '%';
    if (pctEl) pctEl.textContent = Math.round(files[index].progress) + '%';
    if (statusEl) {
        const s = files[index].status;
        const e = files[index].error;
        if (s === 'wait') statusEl.innerHTML = '<span class="status-wait">等待上传</span>';
        else if (s === 'uploading') statusEl.innerHTML = '<span class="status-active">上传中...</span>';
        else if (s === 'done') statusEl.innerHTML = '<span class="status-ok">\u2705 完成</span>';
        else if (s === 'error') statusEl.innerHTML = '<span class="status-err">\u274C ' + e + '</span>';
    }
}

function arrayBufferToBase64(buffer) {
    let binary = '';
    const bytes = new Uint8Array(buffer);
    const len = bytes.length;
    for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
    }
    return btoa(binary);
}

async function uploadFile(fileObj, index) {
    const file = fileObj.file;
    const fileName = fileObj.name;
    const fileSize = file.size;
    const needsChunk = fileSize >= chunkThreshold;

    try {
        updateFileProgress(index, 0, 'uploading');
        const blobShas = [];
        const chunkPaths = [];

        if (needsChunk) {
            const totalChunks = Math.ceil(fileSize / chunkThreshold);
            for (let i = 0; i < totalChunks; i++) {
                const start = i * chunkThreshold;
                const end = Math.min(start + chunkThreshold, fileSize);
                const slice = file.slice(start, end);
                const buf = await slice.arrayBuffer();
                const b64 = arrayBufferToBase64(buf);

                updateFileProgress(index, (i / totalChunks) * 70, 'uploading');
                $('actionInfo').textContent = fileName + ': 上传分块 ' + (i + 1) + '/' + totalChunks;

                const blobData = await api('/repos/' + owner + '/' + repo + '/git/blobs', 'POST', {
                    content: b64,
                    encoding: 'base64'
                });

                const chunkName = fileName + '.' + String(i + 1).padStart(4, '0');
                blobShas.push(blobData.sha);
                chunkPaths.push({ path: webdPrefix + '/' + chunkName, sha: blobData.sha });
            }
            updateFileProgress(index, 70, 'uploading');
        } else {
            const buf = await file.arrayBuffer();
            const b64 = arrayBufferToBase64(buf);

            updateFileProgress(index, 40, 'uploading');
            $('actionInfo').textContent = fileName + ': 创建 Blob...';

            const blobData = await api('/repos/' + owner + '/' + repo + '/git/blobs', 'POST', {
                content: b64,
                encoding: 'base64'
            });

            blobShas.push(blobData.sha);
            chunkPaths.push({ path: webdPrefix + '/' + fileName, sha: blobData.sha });
            updateFileProgress(index, 70, 'uploading');
        }

        $('actionInfo').textContent = fileName + ': 获取当前提交...';
        const refData = await api('/repos/' + owner + '/' + repo + '/git/refs/heads/' + branch);
        const commitData = await api('/repos/' + owner + '/' + repo + '/git/commits/' + refData.object.sha);
        const currentTreeSha = commitData.tree.sha;

        updateFileProgress(index, 80, 'uploading');
        $('actionInfo').textContent = fileName + ': 创建 Tree...';
        const treeData = await api('/repos/' + owner + '/' + repo + '/git/trees', 'POST', {
            base_tree: currentTreeSha,
            tree: chunkPaths.map(cp => ({
                path: cp.path,
                mode: '100644',
                type: 'blob',
                sha: cp.sha
            }))
        });

        updateFileProgress(index, 85, 'uploading');
        $('actionInfo').textContent = fileName + ': 创建 Commit...';
        const commitMsg = needsChunk ? 'upload: ' + fileName + ' (' + chunkPaths.length + ' chunks)' : 'upload: ' + fileName;
        const commitRes = await api('/repos/' + owner + '/' + repo + '/git/commits', 'POST', {
            message: commitMsg,
            tree: treeData.sha,
            parents: [refData.object.sha]
        });

        updateFileProgress(index, 90, 'uploading');
        $('actionInfo').textContent = fileName + ': 更新分支...';
        await api('/repos/' + owner + '/' + repo + '/git/refs/heads/' + branch, 'PATCH', {
            sha: commitRes.sha,
            force: false
        });

        updateFileProgress(index, 100, 'done');
        toast('\u2705 ' + fileName + ' 上传成功');
    } catch (e) {
        updateFileProgress(index, files[index].progress, 'error', e.message);
        toast('\u274C ' + fileName + ' 上传失败: ' + e.message, '#f44336');
    }
}

$('uploadBtn').addEventListener('click', async function() {
    if (!authenticated) { toast('请先验证 PAT'); return; }
    if (files.length === 0) { toast('请先添加文件'); return; }
    if (files.some(f => f.status === 'uploading')) { toast('已有文件正在上传'); return; }

    this.disabled = true;
    $('actionInfo').textContent = '准备上传...';

    for (let i = 0; i < files.length; i++) {
        if (files[i].status === 'done') continue;
        await uploadFile(files[i], i);
    }

    $('actionInfo').textContent = '所有文件处理完毕';
    this.disabled = false;
});

window.addEventListener('DOMContentLoaded', function() {
    renderQueue();
});
</script>
</body>
</html>

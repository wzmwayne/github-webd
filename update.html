<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebD Cloud - Upload</title>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{padding:20px;background:#f5f5f5;min-height:100vh}
h1{font-size:22px;margin-bottom:16px;color:#333}
#authBox{background:#fff;border:1px solid #ddd;border-radius:8px;padding:24px;margin-bottom:20px;max-width:500px}
#authBox label{display:block;font-size:14px;margin-bottom:6px;color:#555}
#authBox input[type=password]{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:4px;font-size:14px;margin-bottom:12px}
#authBox .hint{font-size:12px;color:#888;margin-bottom:12px}
#authBox button{padding:10px 24px;background:#1976d2;color:#fff;border:none;border-radius:4px;font-size:14px;cursor:pointer}
#authBox button:hover{background:#1565c0}
#authBox .status{font-size:13px;margin-top:8px;color:#4caf50}
#pathRow{margin-bottom:16px}
#pathRow label{display:block;font-size:13px;color:#555;margin-bottom:4px}
#pathRow input{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:4px;font-size:14px}
#pathRow .hint{font-size:12px;color:#888;margin-top:2px}
#dropZone{background:#fff;border:2px dashed #ccc;border-radius:8px;padding:40px;text-align:center;margin-bottom:20px;cursor:pointer;transition:all .2s}
#dropZone.dragover{border-color:#1976d2;background:#e3f2fd}
#dropZone .icon{font-size:48px;color:#999}
#dropZone .text{font-size:16px;color:#666;margin-top:8px}
#dropZone .subtext{font-size:13px;color:#999;margin-top:4px}
#dropZone input[type=file]{display:none}
#queue{margin-bottom:20px}
.file-item{background:#fff;border:1px solid #ddd;border-radius:6px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.file-item .info{flex:1;min-width:0}
.file-item .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-item .meta{font-size:12px;color:#888;margin-top:2px}
.file-item .progress{width:120px;height:6px;background:#eee;border-radius:3px;overflow:hidden}
.file-item .progress-bar{height:100%;background:#4caf50;border-radius:3px;width:0%;transition:width .3s}
.file-item .pct{font-size:12px;color:#666;min-width:36px;text-align:right}
.file-item .status{font-size:12px;min-width:80px;text-align:right}
.status-ok{color:#4caf50}
.status-wait{color:#999}
.status-active{color:#1976d2}
.status-err{color:#f44336}
#actions{margin-top:16px}
#actions button{padding:10px 28px;background:#4caf50;color:#fff;border:none;border-radius:4px;font-size:14px;cursor:pointer;margin-right:8px}
#actions button:hover{background:#388e3c}
#actions button:disabled{opacity:.5;cursor:not-allowed}
#actions .info{font-size:13px;color:#666;display:inline-block;margin-left:12px}
</style>
</head>
<body>

<h1>WebD Cloud - 上传文件</h1>

<div id="authBox">
    <label>GitHub Personal Access Token</label>
    <input type="password" id="patInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
    <div class="hint">需要 repo 权限。Token 仅存于内存，刷新页面后需重新输入。</div>
    <label style="font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:12px;cursor:pointer">
        <input type="checkbox" id="savePatCheck"> 记住 PAT（本地加密存储）
    </label>
    <button id="authBtn">验证</button>
    <div id="authStatus" class="status"></div>
</div>

<div id="pathRow">
    <label>目标路径（选填）</label>
    <input type="text" id="targetPath" placeholder="留空=webd/根目录，如 a/b/c/d/e/f/g/h 则上传到 webd/a/b/c/d/e/f/g/h/">
    <div class="hint">支持多级目录，如 a/b/c/d，最多 8 层。无需首尾斜杠。</div>
</div>

<div id="dropZone">
    <div class="icon">&#x1F4C2;</div>
    <div class="text">拖拽文件到此处，或点击选择文件</div>
    <div class="subtext">支持单个文件，超过 20MB 自动分块上传</div>
    <input type="file" id="fileInput">
</div>

<div id="queue"></div>

<div id="actions">
    <button id="uploadBtn" disabled>开始上传</button>
    <span class="info" id="actionInfo"></span>
</div>

<script>
let pat = '';
let authenticated = false;
let files = [];

const apiBase = 'https://api.github.com';
const owner = CONFIG.owner;
const repo = CONFIG.repo;
const branch = CONFIG.branch;
const webdPrefix = CONFIG.webdPrefix;
const chunkThreshold = 20 * 1024 * 1024;
const STORAGE_KEY = 'webd_encrypted_pat';
const KEY_STORE = 'webd_crypto_key';

function $(id) { return document.getElementById(id); }

function toast(msg, color) {
    const el = document.createElement('div');
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:12px 24px;border-radius:6px;font-size:14px;z-index:9999;max-width:80vw';
    el.textContent = msg;
    if (color) el.style.background = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
}

function formatSize(bytes) {
    const units = ['B','KB','MB','GB','TB'];
    let i = 0;
    let size = bytes;
    while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
    return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function getTargetPrefix() {
    const p = $('targetPath').value.trim();
    if (!p) return webdPrefix;
    return webdPrefix + '/' + p.replace(/^\/+|\/+$/g, '');
}

async function api(url, method, body) {
    const headers = { 'Authorization': 'Bearer ' + pat, 'Accept': 'application/json' };
    if (body) headers['Content-Type'] = 'application/json';
    const resp = await fetch(apiBase + url, { method: method || 'GET', headers, body: body ? JSON.stringify(body) : null });
    if (resp.status === 204) return null;
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.message || ('HTTP ' + resp.status));
    return data;
}

async function generateKey() {
    return await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}

async function exportKey(key) {
    return await crypto.subtle.exportKey('jwk', key);
}

async function importKey(jwk) {
    return await crypto.subtle.importKey('jwk', jwk, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

async function saveKey(key) {
    const jwk = await exportKey(key);
    try { localStorage.setItem(KEY_STORE, JSON.stringify(jwk)); } catch {}
}

function loadKey() {
    try {
        const raw = localStorage.getItem(KEY_STORE);
        if (!raw) return null;
        return JSON.parse(raw);
    } catch { return null; }
}

async function encryptPat(text) {
    const key = await generateKey();
    await saveKey(key);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const encoded = new TextEncoder().encode(text);
    const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, encoded);
    const combined = new Uint8Array(iv.length + encrypted.byteLength);
    combined.set(iv, 0);
    combined.set(new Uint8Array(encrypted), iv.length);
    const b64 = btoa(String.fromCharCode(...combined));
    try { localStorage.setItem(STORAGE_KEY, b64); } catch {}
}

async function decryptPat() {
    try {
        const b64 = localStorage.getItem(STORAGE_KEY);
        if (!b64) return '';
        const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        const iv = raw.slice(0, 12);
        const data = raw.slice(12);
        const jwk = loadKey();
        if (!jwk) return '';
        const key = await importKey(jwk);
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
        return new TextDecoder().decode(decrypted);
    } catch { return ''; }
}

function clearSavedPat() {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
}

async function tryAutoAuth() {
    const saved = await decryptPat();
    if (!saved) return;
    $('patInput').value = saved;
    const btn = $('authBtn');
    btn.click();
}

async function doAuth() {
    const input = $('patInput');
    pat = input.value.trim();
    if (!pat) { toast('请输入 PAT'); return; }
    try {
        await api('/user');
        const repoData = await api('/repos/' + owner + '/' + repo);
        const perms = repoData.permissions || {};
        if (!perms.push) {
            $('authStatus').textContent = '失败: Token 没有仓库写入权限，请检查 repo 或 workflow 权限';
            $('authStatus').style.color = '#f44336';
            toast('Token 缺少 push 权限', '#f44336');
            pat = '';
            return;
        }
        $('authStatus').textContent = '验证通过 - ' + repoData.full_name + ' (push: ok)';
        authenticated = true;
        input.disabled = true;
        document.getElementById('authBtn').disabled = true;
        $('uploadBtn').disabled = files.length === 0;
        if ($('savePatCheck').checked) await encryptPat(pat);
        toast('验证通过');
    } catch (e) {
        $('authStatus').textContent = '失败 ' + e.message;
        $('authStatus').style.color = '#f44336';
        toast('验证失败: ' + e.message, '#f44336');
    }
}

$('authBtn').addEventListener('click', doAuth);

const dropZone = $('dropZone');
const fileInput = $('fileInput');

dropZone.addEventListener('click', function() { fileInput.click(); });
dropZone.addEventListener('dragover', function(e) { e.preventDefault(); this.classList.add('dragover'); });
dropZone.addEventListener('dragleave', function() { this.classList.remove('dragover'); });
dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) addFiles(e.dataTransfer.files);
});

fileInput.addEventListener('change', function() {
    if (this.files.length > 0) { addFiles(this.files); this.value = ''; }
});

function addFiles(fileList) {
    for (const f of fileList) {
        const existing = files.findIndex(x => x.name === f.name && x.size === f.size);
        if (existing >= 0) files.splice(existing, 1);
        files.push({ file: f, name: f.name, size: f.size, status: 'wait', progress: 0, error: '' });
    }
    renderQueue();
    if (authenticated) $('uploadBtn').disabled = false;
}

function renderQueue() {
    const container = $('queue');
    if (files.length === 0) { container.innerHTML = '<div style="color:#999;padding:12px;text-align:center;font-size:14px;">尚未添加文件</div>'; return; }
    container.innerHTML = '';
    for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const div = document.createElement('div');
        div.className = 'file-item';
        div.id = 'file-' + i;
        const chunkCount = Math.ceil(f.file.size / chunkThreshold);
        const chunkInfo = f.file.size >= chunkThreshold ? ('分为 ' + chunkCount + ' 块') : '单文件';
        div.innerHTML = '<div class="info"><div class="name">' + f.name + '</div><div class="meta">' + formatSize(f.size) + ' &middot; ' + chunkInfo + '</div></div><div class="progress"><div class="progress-bar" style="width:' + f.progress + '%"></div></div><div class="pct">' + Math.round(f.progress) + '%</div><div class="status">' + (f.status === 'wait' ? '<span class="status-wait">等待上传</span>' : f.status === 'uploading' ? '<span class="status-active">上传中...</span>' : f.status === 'done' ? '<span class="status-ok">完成</span>' : '<span class="status-err">失败 ' + f.error + '</span>') + '</div>';
        container.appendChild(div);
    }
}

function updateFileProgress(index, pct, status, error) {
    if (index < 0 || index >= files.length) return;
    if (pct !== undefined) files[index].progress = pct;
    if (status) { files[index].status = status; if (status === 'error') files[index].error = error || ''; }
    const item = document.getElementById('file-' + index);
    if (!item) return;
    if (item.querySelector('.progress-bar')) item.querySelector('.progress-bar').style.width = files[index].progress + '%';
    if (item.querySelector('.pct')) item.querySelector('.pct').textContent = Math.round(files[index].progress) + '%';
    if (item.querySelector('.status')) {
        const s = files[index].status, e = files[index].error;
        item.querySelector('.status').innerHTML = s === 'wait' ? '<span class="status-wait">等待上传</span>' : s === 'uploading' ? '<span class="status-active">上传中...</span>' : s === 'done' ? '<span class="status-ok">完成</span>' : '<span class="status-err">失败 ' + e + '</span>';
    }
}

function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

async function uploadViaContents(filePath, contentBase64, message) {
    let sha;
    try {
        const existing = await api('/repos/' + owner + '/' + repo + '/contents/' + filePath, 'GET');
        sha = existing.sha;
    } catch (e) {}
    const body = { message: message, content: contentBase64, branch: branch };
    if (sha) body.sha = sha;
    return await api('/repos/' + owner + '/' + repo + '/contents/' + filePath, 'PUT', body);
}

async function uploadFile(fileObj, index) {
    const file = fileObj.file;
    const fileName = fileObj.name;
    const fileSize = file.size;
    const targetPrefix = getTargetPrefix();
    const needsChunk = fileSize >= chunkThreshold;

    try {
        updateFileProgress(index, 0, 'uploading');

        if (!needsChunk) {
            $('actionInfo').textContent = fileName + ': 编码中...';
            const b64 = await blobToBase64(file);
            updateFileProgress(index, 50, 'uploading');
            $('actionInfo').textContent = fileName + ': 上传中...';
            await uploadViaContents(targetPrefix + '/' + fileName, b64, 'upload: ' + fileName);
            updateFileProgress(index, 100, 'done');
            toast('上传成功 ' + fileName);
            $('actionInfo').textContent = '';
            return;
        }

        const totalChunks = Math.ceil(fileSize / chunkThreshold);
        const tasks = [];
        for (let i = 0; i < totalChunks; i++) {
            const start = i * chunkThreshold;
            const end = Math.min(start + chunkThreshold, fileSize);
            const slice = file.slice(start, end);
            const chunkName = fileName + '.' + String(i + 1).padStart(4, '0');
            const filePath = targetPrefix + '/' + chunkName;
            tasks.push(async () => {
                const b64 = await blobToBase64(slice);
                await uploadViaContents(filePath, b64, 'upload: ' + fileName + ' chunk ' + (i + 1) + '/' + totalChunks);
            });
        }

        let completed = 0;
        function updateChunkProgress() {
            completed++;
            updateFileProgress(index, Math.round((completed / totalChunks) * 100), 'uploading');
            $('actionInfo').textContent = fileName + ': ' + completed + '/' + totalChunks + ' 块';
        }

        $('actionInfo').textContent = fileName + ': 0/' + totalChunks + ' 块';

        const concurrency = 5;
        const executing = [];
        for (const task of tasks) {
            const p = task().then(r => { executing.splice(executing.indexOf(p), 1); updateChunkProgress(); return r; });
            executing.push(p);
            if (executing.length >= concurrency) await Promise.race(executing);
        }
        await Promise.all(executing);

        updateFileProgress(index, 100, 'done');
        toast('上传成功 ' + fileName + ' (' + totalChunks + ' 块)');
        $('actionInfo').textContent = '';
    } catch (e) {
        updateFileProgress(index, files[index].progress, 'error', e.message);
        toast('上传失败 ' + fileName + ': ' + e.message, '#f44336');
        $('actionInfo').textContent = '';
    }
}

$('uploadBtn').addEventListener('click', async function() {
    if (!authenticated) { toast('请先验证 PAT'); return; }
    if (files.length === 0) { toast('请先添加文件'); return; }
    if (files.some(f => f.status === 'uploading')) { toast('已有文件正在上传'); return; }

    this.disabled = true;

    for (let i = 0; i < files.length; i++) {
        if (files[i].status === 'done') continue;
        await uploadFile(files[i], i);
    }

    $('actionInfo').textContent = '正在触发索引更新...';
    try {
        await api('/repos/' + owner + '/' + repo + '/actions/workflows/index.yml/dispatches', 'POST', { ref: branch });
        $('actionInfo').textContent = '所有文件处理完毕，索引构建已触发';
        toast('已触发索引更新');
    } catch (e) {
        $('actionInfo').textContent = '上传完成，但触发索引失败: ' + e.message;
        toast('索引触发失败: ' + e.message + '，可手动触发', '#f44336');
    }

    this.disabled = false;
});

window.addEventListener('DOMContentLoaded', async function() {
    renderQueue();
    tryAutoAuth();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebD Cloud</title>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{min-height:100vh;background:#f5f5f5}
#hintBar{display:none;padding:8px 20px;background:#fff3e0;border-bottom:1px solid #ffe0b2;font-size:13px;color:#e65100;cursor:pointer}
#pathBar{display:flex;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid #ddd;font-size:14px;color:#666}
#pathBar .flex{flex:1}
#refreshBtn{background:none;border:1px solid #ccc;border-radius:4px;padding:4px 12px;font-size:13px;cursor:pointer;color:#666}
#refreshBtn:hover{background:#f0f0f0}
#refreshBtn.loading{opacity:.5;pointer-events:none}
#content{overflow:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th{text-align:left;padding:10px 16px;font-size:13px;color:#666;border-bottom:2px solid #eee;font-weight:600;position:sticky;top:0;background:#fff}
td{padding:8px 16px;font-size:14px;border-bottom:1px solid #f0f0f0}
tr:hover td{background:#fafafa}
.name-cell{display:flex;align-items:center;gap:8px}
.name-cell .icon{width:24px;text-align:center;font-size:16px}
.name-cell a{color:#1976d2;text-decoration:none}
.name-cell a:hover{text-decoration:underline}
.size-cell{white-space:nowrap;color:#666}
.time-cell{white-space:nowrap;color:#666;font-size:13px}
.empty{padding:40px;text-align:center;color:#999;font-size:15px}
.back{color:#666;font-style:italic}
.back:hover{background:#f5f5f5}
</style>
</head>
<body>
<div id="hintBar"></div>
<div id="pathBar"><span id="currentPath">/</span><span class="flex"></span><button id="refreshBtn">&#x21BB; 刷新</button></div>
<div id="content">
    <table id="fileTable">
        <thead><tr><th>名称</th><th>大小</th><th>修改时间</th></tr></thead>
        <tbody id="fileBody"></tbody>
    </table>
    <div class="empty" id="emptyHint" style="display:none">此目录为空</div>
</div>

<script>
let indexData = [];
let currentNode = '';
const CACHE_KEY = 'webd_index_cache';
const CACHE_TTL = 60000;

function formatSize(bytes) {
    if (!bytes) return '-';
    const units = ['B','KB','MB','GB','TB'];
    let i = 0;
    let size = bytes;
    while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
    return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function formatTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function getFileIcon(entry) {
    if (entry.type === 'merged') return '\uD83D\uDCC1';
    const ext = entry.path.split('.').pop().toLowerCase();
    const img = ['jpg','jpeg','png','gif','webp','bmp','ico','svg'];
    const vid = ['mp4','avi','mkv','mov','webm'];
    const aud = ['mp3','wav','ogg','flac'];
    const arch = ['zip','rar','7z','tar','gz','iso'];
    if (img.includes(ext)) return '\uD83D\uDDBC';
    if (vid.includes(ext)) return '\uD83C\uDFA5';
    if (aud.includes(ext)) return '\uD83C\uDFB5';
    if (arch.includes(ext)) return '\uD83D\uDCE6';
    if (['pdf'].includes(ext)) return '\uD83D\uDCC4';
    if (['txt','md','csv','xml','json','js','html','css'].includes(ext)) return '\uD83D\uDCDD';
    return '\uD83D\uDCC4';
}

function renderTable() {
    const tbody = document.getElementById('fileBody');
    const emptyHint = document.getElementById('emptyHint');
    tbody.innerHTML = '';

    const prefix = currentNode ? currentNode + '/' : '';
    const dirs = new Set();

    for (const e of indexData) {
        if (e.type === 'chunk') continue;
        const p = e.path;
        if (!p.startsWith(prefix)) continue;
        const rest = p.slice(prefix.length);
        if (!rest || rest.indexOf('/') === -1) continue;
        const d = rest.split('/')[0];
        if (d) dirs.add(d);
    }

    const result = [];

    if (currentNode) {
        result.push({ _isBack: true });
    }

    for (const d of [...dirs].sort()) {
        result.push({ _isDir: true, _name: d, _dirPath: currentNode ? currentNode + '/' + d : d });
    }

    const files = [];
    for (const e of indexData) {
        if (e.type === 'chunk') continue;
        const p = e.path;
        if (!p.startsWith(prefix)) continue;
        const rest = p.slice(prefix.length);
        if (!rest || rest.indexOf('/') !== -1) continue;
        files.push(e);
    }
    files.sort((a, b) => a.path.localeCompare(b.path));
    for (const f of files) result.push(f);

    if (result.length === 0) {
        emptyHint.style.display = '';
        return;
    }
    emptyHint.style.display = 'none';

    for (const e of result) {
        const tr = document.createElement('tr');
        if (e._isBack) {
            tr.innerHTML = '<td colspan="3"><div class="name-cell back"><span class="icon">\u219D</span> ..</div></td>';
            tr.style.cursor = 'pointer';
            tr.addEventListener('click', function() {
                const parts = currentNode.split('/');
                parts.pop();
                currentNode = parts.join('/');
                document.getElementById('currentPath').textContent = '/' + currentNode;
                renderTable();
            });
        } else if (e._isDir) {
            tr.innerHTML = '<td><div class="name-cell"><span class="icon">\uD83D\uDCC1</span>' + e._name + '</div></td><td class="size-cell">-</td><td class="time-cell">-</td>';
            tr.style.cursor = 'pointer';
            tr.addEventListener('click', function() {
                currentNode = e._dirPath;
                document.getElementById('currentPath').textContent = '/' + currentNode;
                renderTable();
            });
        } else {
            const name = e.path.split('/').pop();
            const link = 'download.html?path=' + encodeURIComponent(e.path);
            tr.innerHTML = '<td><div class="name-cell"><span class="icon">' + getFileIcon(e) + '</span><a href="' + link + '">' + name + '</a></div></td><td class="size-cell">' + formatSize(e.size) + '</td><td class="time-cell">' + formatTime(e.mtime) + '</td>';
        }
        tbody.appendChild(tr);
    }

    document.getElementById('currentPath').textContent = '/' + currentNode;
}

async function loadIndex(force) {
    function showHint(msg) {
        const el = document.getElementById('hintBar');
        el.textContent = '\u26A0 ' + msg + ' (\u70B9\u51FB\u5173\u95ED)';
        el.style.display = '';
        el.onclick = function() { this.style.display = 'none'; };
    }

    if (!force) {
        try {
            const cached = JSON.parse(sessionStorage.getItem(CACHE_KEY));
            if (cached && Date.now() - cached.ts < CACHE_TTL) {
                indexData = cached.data;
                renderTable();
                return;
            }
        } catch {}
    }

    const pagesUrl = 'index.json?_t=' + Date.now();
    const rawUrl = CONFIG.rawBase + 'index.json?_t=' + Date.now();
    let pagesData = null, rawData = null, pagesErr = null, rawErr = null;

    try {
        const r = await fetch(pagesUrl);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        pagesData = await r.json();
    } catch (e) { pagesErr = e.message; }

    try {
        const r = await fetch(rawUrl);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        rawData = await r.json();
    } catch (e) { rawErr = e.message; }

    if (rawData && pagesData) {
        if (JSON.stringify(rawData) !== JSON.stringify(pagesData)) {
            indexData = rawData;
            showHint('\u5DF2\u5207\u6362\u4E3A\u5B9E\u65F6\u7D22\u5F15\uFF08raw \u6A21\u5F0F\uFF09');
        } else {
            indexData = pagesData;
        }
    } else if (rawData) {
        indexData = rawData;
        showHint('Pages \u7D22\u5F15\u4E0D\u53EF\u7528\uFF0C\u4F7F\u7528 raw \u6A21\u5F0F');
    } else if (pagesData) {
        indexData = pagesData;
        showHint('Raw \u7D22\u5F15\u4E0D\u53EF\u7528\uFF0C\u4F7F\u7528 Pages \u7F13\u5B58');
    } else {
        document.getElementById('fileBody').innerHTML = '<tr><td colspan="3" style="text-align:center;padding:40px;color:red;">\u52A0\u8F7D\u7D22\u5F15\u5931\u8D25<br>Pages: ' + (pagesErr || 'unknown') + '<br>Raw: ' + (rawErr || 'unknown') + '</td></tr>';
        return;
    }

    try { sessionStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: indexData })); } catch {}
    renderTable();
}

window.addEventListener('DOMContentLoaded', function() {
    loadIndex();
    document.getElementById('refreshBtn').addEventListener('click', function() {
        const btn = this;
        btn.classList.add('loading');
        btn.textContent = '\u21BB 刷新中...';
        try { sessionStorage.removeItem(CACHE_KEY); } catch {}
        loadIndex(true).then(function() {
            btn.classList.remove('loading');
            btn.textContent = '\u21BB 刷新';
            document.getElementById('hintBar').style.display = 'none';
        });
    });
});
</script>
</body>
</html>

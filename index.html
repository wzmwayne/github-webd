<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebD Cloud</title>
<script src="config.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{display:flex;height:100vh;background:#f5f5f5}
#sidebar{width:320px;min-width:320px;background:#fff;border-right:1px solid #ddd;display:flex;flex-direction:column}
#sidebar h2{padding:16px;font-size:18px;border-bottom:1px solid #eee}
#tree{flex:1;overflow-y:auto;padding:8px 0}
.tree-item{padding:6px 16px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:14px;user-select:none}
.tree-item:hover{background:#f0f0f0}
.tree-item.selected{background:#e3f2fd;font-weight:600}
.tree-item .icon{width:20px;text-align:center;flex-shrink:0;transition:transform .2s}
.tree-children{padding-left:24px}
.tree-leaf{padding:6px 16px 6px 40px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px}
.tree-leaf:hover{background:#f0f0f0}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#pathBar{padding:12px 20px;background:#fff;border-bottom:1px solid #ddd;font-size:14px;color:#666}
#content{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;background:#fff}
th{text-align:left;padding:10px 16px;font-size:13px;color:#666;border-bottom:2px solid #eee;font-weight:600;position:sticky;top:0;background:#fff}
td{padding:8px 16px;font-size:14px;border-bottom:1px solid #f0f0f0}
tr:hover td{background:#fafafa}
.name-cell{display:flex;align-items:center;gap:8px}
.name-cell .icon{width:24px;text-align:center;font-size:16px}
.name-cell a{color:#1976d2;text-decoration:none}
.name-cell a:hover{text-decoration:underline}
.size-cell{white-space:nowrap;color:#666}
.time-cell{white-space:nowrap;color:#666;font-size:13px}
.empty{padding:40px;text-align:center;color:#999;font-size:15px}
</style>
</head>
<body>
<div id="sidebar">
    <h2>&#x1F4C1; WebD Cloud</h2>
    <div id="tree"></div>
</div>
<div id="main">
    <div id="pathBar"><span id="currentPath">/</span></div>
    <div id="content">
        <table id="fileTable">
            <thead><tr><th>名称</th><th>大小</th><th>修改时间</th></tr></thead>
            <tbody id="fileBody"></tbody>
        </table>
        <div class="empty" id="emptyHint" style="display:none">此目录为空</div>
    </div>
</div>

<script>
let indexData = [];
let treeData = null;
let currentNode = '';

function formatSize(bytes) {
    if (!bytes) return '-';
    const units = ['B','KB','MB','GB','TB'];
    let i = 0;
    let size = bytes;
    while (size >= 1024 && i < units.length - 1) { size /= 1024; i++; }
    return size.toFixed(i > 0 ? 1 : 0) + ' ' + units[i];
}

function formatTime(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function getFileIcon(entry) {
    if (entry.type === 'merged') return '\uD83D\uDCC1';
    const ext = entry.path.split('.').pop().toLowerCase();
    const img = ['jpg','jpeg','png','gif','webp','bmp','ico','svg'];
    const vid = ['mp4','avi','mkv','mov','webm'];
    const aud = ['mp3','wav','ogg','flac'];
    const arch = ['zip','rar','7z','tar','gz','iso'];
    if (img.includes(ext)) return '\uD83D\uDDBC';
    if (vid.includes(ext)) return '\uD83C\uDFA5';
    if (aud.includes(ext)) return '\uD83C\uDFB5';
    if (arch.includes(ext)) return '\uD83D\uDCE6';
    if (['pdf'].includes(ext)) return '\uD83D\uDCC4';
    if (['txt','md','csv','xml','json','js','html','css'].includes(ext)) return '\uD83D\uDCDD';
    return '\uD83D\uDCC4';
}

function buildTree(entries) {
    const root = { name: '', children: {}, files: [], path: '' };
    for (const e of entries) {
        if (e.type === 'chunk') continue;
        const parts = e.path.split('/');
        let node = root;
        for (let i = 0; i < parts.length - 1; i++) {
            if (!node.children[parts[i]]) {
                node.children[parts[i]] = { name: parts[i], children: {}, files: [], path: parts.slice(0, i+1).join('/') };
            }
            node = node.children[parts[i]];
        }
        node.files.push(e);
    }
    return root;
}

function renderTree() {
    const container = document.getElementById('tree');
    container.innerHTML = '';
    renderTreeNode(container, treeData, '');
}

function renderTreeNode(parentEl, node) {
    const dirs = Object.keys(node.children).sort();
    for (const dirName of dirs) {
        const child = node.children[dirName];
        const item = document.createElement('div');
        item.className = 'tree-item' + (currentNode === child.path ? ' selected' : '');
        item.innerHTML = '<span class="icon">\u25B6</span><span>' + dirName + '</span>';
        item._dirNode = child;
        item._childrenContainer = document.createElement('div');
        item._childrenContainer.className = 'tree-children';
        item._childrenContainer.style.display = 'none';
        item._expanded = false;

        item.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!this._expanded) {
                this._expanded = true;
                this.querySelector('.icon').textContent = '\u25BC';
                this._childrenContainer.style.display = '';
                if (this._childrenContainer.children.length === 0) {
                    renderTreeNode(this._childrenContainer, this._dirNode);
                }
            } else {
                this._expanded = false;
                this.querySelector('.icon').textContent = '\u25B6';
                this._childrenContainer.style.display = 'none';
            }
            currentNode = child.path;
            document.querySelectorAll('.tree-item.selected').forEach(el => el.classList.remove('selected'));
            this.classList.add('selected');
            renderTable();
        });
        parentEl.appendChild(item);
        parentEl.appendChild(item._childrenContainer);
    }

    for (const f of node.files) {
        const leaf = document.createElement('div');
        leaf.className = 'tree-leaf';
        leaf.innerHTML = '<span class="icon">' + getFileIcon(f) + '</span><a href="download.html?path=' + encodeURIComponent(f.path) + '" style="color:#1976d2;text-decoration:none">' + f.path.split('/').pop() + '</a>';
        parentEl.appendChild(leaf);
    }
}

function renderTable() {
    const tbody = document.getElementById('fileBody');
    const emptyHint = document.getElementById('emptyHint');
    tbody.innerHTML = '';

    const entries = [];

    if (currentNode === '' || currentNode === null) {
        for (const dirName of Object.keys(treeData.children).sort()) {
            entries.push({ path: dirName, _isDir: true });
        }
        for (const f of treeData.files) {
            if (f.type !== 'chunk') entries.push(f);
        }
    } else if (treeData) {
        const parts = currentNode.split('/');
        let node = treeData;
        for (const p of parts) {
            if (node.children[p]) node = node.children[p];
            else break;
        }
        for (const dirName of Object.keys(node.children).sort()) {
            entries.push({ path: currentNode + '/' + dirName, _isDir: true, _name: dirName });
        }
        for (const f of node.files) {
            if (f.type !== 'chunk') entries.push({ ...f, _name: f.path.split('/').pop() });
        }
    }

    entries.sort((a, b) => {
        if (a._isDir && !b._isDir) return -1;
        if (!a._isDir && b._isDir) return 1;
        return (a._name || a.path).localeCompare(b._name || b.path);
    });

    if (entries.length === 0) {
        emptyHint.style.display = '';
        return;
    }
    emptyHint.style.display = 'none';

    for (const e of entries) {
        const tr = document.createElement('tr');
        if (e._isDir) {
            const name = e._name || e.path.split('/').pop();
            tr.innerHTML = '<td><div class="name-cell"><span class="icon">\uD83D\uDCC1</span>' + name + '</div></td><td class="size-cell">-</td><td class="time-cell">-</td>';
            tr.style.cursor = 'pointer';
            tr.addEventListener('click', function() {
                currentNode = e.path;
                document.querySelectorAll('.tree-item.selected').forEach(el => el.classList.remove('selected'));
                for (const ti of document.querySelectorAll('.tree-item')) {
                    if (ti._dirNode && ti._dirNode.path === e.path) { ti.click(); return; }
                }
                document.getElementById('currentPath').textContent = '/' + currentNode;
                renderTable();
            });
        } else {
            const name = e._name || e.path.split('/').pop();
            const link = 'download.html?path=' + encodeURIComponent(e.path);
            tr.innerHTML = '<td><div class="name-cell"><span class="icon">' + getFileIcon(e) + '</span><a href="' + link + '">' + name + '</a></div></td><td class="size-cell">' + formatSize(e.size) + '</td><td class="time-cell">' + formatTime(e.mtime) + '</td>';
        }
        tbody.appendChild(tr);
    }

    document.getElementById('currentPath').textContent = '/' + currentNode;
}

async function loadIndex() {
    try {
        const resp = await fetch('index.json?_t=' + Date.now());
        const raw = await resp.json();
        indexData = raw;
        treeData = buildTree(indexData);
        renderTree();
        renderTable();
    } catch (e) {
        document.getElementById('fileBody').innerHTML = '<tr><td colspan="3" style="text-align:center;padding:40px;color:red;">加载 index.json 失败: ' + e.message + '</td></tr>';
    }
}

window.addEventListener('DOMContentLoaded', function() {
    loadIndex();
});
</script>
</body>
</html>
